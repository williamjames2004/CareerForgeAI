<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interview Setup - CareerForge AI</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <style>

        body {

            background: #f8f9fa;

            color: #212529;

        }


        .navbar {

            background: white;

            border-bottom: 1px solid #e9ecef;

        }


        .brand-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background: #0d6efd;

            color: white;

            font-size: 21px;

        }


        .setup-container {

            max-width: 950px;

            margin: 50px auto;

        }


        .setup-card {

            background: white;

            border: 1px solid #e9ecef;

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.05);

        }


        .page-icon {

            width: 65px;
            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background: #e7f1ff;

            color: #0d6efd;

            font-size: 30px;

            margin-bottom: 20px;

        }


        .section-title {

            font-weight: 700;

            margin-top: 35px;

            margin-bottom: 20px;

            padding-bottom: 10px;

            border-bottom: 1px solid #e9ecef;

        }


        .form-label {

            font-weight: 600;

        }


        .form-control,
        .form-select {

            padding: 12px 14px;

            border-radius: 10px;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #0d6efd;

            box-shadow:
                0 0 0 0.2rem rgba(
                    13,
                    110,
                    253,
                    0.1
                );

        }


        .info-box {

            background: #f0f7ff;

            border: 1px solid #cfe2ff;

            border-radius: 12px;

            padding: 15px;

            color: #084298;

        }


        .start-btn {

            padding: 13px 30px;

            font-weight: 600;

            border-radius: 12px;

        }


        @media (max-width: 768px) {

            .setup-card {

                padding: 25px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="container">

        <a
            href="{{ url_for('index') }}"
            class="navbar-brand d-flex align-items-center gap-2"
        >

            <span class="brand-icon">

                <i class="bi bi-stars"></i>

            </span>

            <strong>
                CareerForge AI
            </strong>

        </a>


        <a
            href="{{ url_for('index') }}"
            class="btn btn-outline-secondary"
        >

            <i class="bi bi-house me-1"></i>

            Home

        </a>

    </div>

</nav>



<!-- =====================================================
     SETUP
===================================================== -->

<div class="container">

    <div class="setup-container">

        <div class="setup-card">


            <!-- HEADER -->

            <div class="text-center">

                <div class="page-icon mx-auto">

                    <i class="bi bi-person-video3"></i>

                </div>


                <h2 class="fw-bold">

                    AI Interview Setup

                </h2>


                <p class="text-secondary">

                    Tell the AI interviewer a little about yourself
                    before we begin.

                </p>

            </div>



            <!-- INFO -->

            <div class="info-box mt-4">

                <i class="bi bi-info-circle me-2"></i>

                Your information will be used to generate
                personalized interview questions.

            </div>



            <!-- =================================================
                 FORM
            ================================================= -->

            <form
                action="{{ url_for('start_interview') }}"
                method="POST"
                class="mt-4"
            >


                <!-- =================================================
                     PERSONAL INFORMATION
                ================================================= -->

                <h5 class="section-title">

                    <i class="bi bi-person me-2"></i>

                    Personal Information

                </h5>


                <div class="row g-3">


                    <!-- NAME -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="you@example.com"
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                        >

                    </div>


                    <!-- LOCATION -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Location

                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="City, State"
                        >

                    </div>

                </div>



                <!-- =================================================
                     EDUCATION
                ================================================= -->

                <h5 class="section-title">

                    <i class="bi bi-mortarboard me-2"></i>

                    Education

                </h5>


                <div class="row g-3">


                    <!-- DEGREE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Degree / Qualification

                        </label>

                        <input
                            type="text"
                            name="degree"
                            class="form-control"
                            placeholder="e.g. M.Sc Artificial Intelligence"
                            required
                        >

                    </div>


                    <!-- COLLEGE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            College / University

                        </label>

                        <input
                            type="text"
                            name="college"
                            class="form-control"
                            placeholder="Enter institution name"
                            required
                        >

                    </div>


                    <!-- YEAR -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Graduation Year

                        </label>

                        <input
                            type="number"
                            name="graduation_year"
                            class="form-control"
                            placeholder="2026"
                        >

                    </div>


                    <!-- SPECIALIZATION -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Specialization

                        </label>

                        <input
                            type="text"
                            name="specialization"
                            class="form-control"
                            placeholder="e.g. Machine Learning"
                        >

                    </div>

                </div>



                <!-- =================================================
                     WORK EXPERIENCE
                ================================================= -->

                <h5 class="section-title">

                    <i class="bi bi-briefcase me-2"></i>

                    Work Experience

                </h5>


                <div class="row g-3">


                    <!-- EXPERIENCE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Experience

                        </label>

                        <select
                            name="work_experience"
                            class="form-select"
                        >

                            <option value="Fresher">
                                Fresher
                            </option>

                            <option value="Less than 1 year">
                                Less than 1 year
                            </option>

                            <option value="1-2 years">
                                1 - 2 years
                            </option>

                            <option value="2-5 years">
                                2 - 5 years
                            </option>

                            <option value="5+ years">
                                5+ years
                            </option>

                        </select>

                    </div>


                    <!-- COMPANY -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Company

                        </label>

                        <input
                            type="text"
                            name="company"
                            class="form-control"
                            placeholder="Company name"
                        >

                    </div>


                    <!-- ROLE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Previous Job Role

                        </label>

                        <input
                            type="text"
                            name="job_role"
                            class="form-control"
                            placeholder="e.g. Web Developer"
                        >

                    </div>

                </div>



                <!-- =================================================
                     PROJECT INFORMATION
                ================================================= -->

                <h5 class="section-title">

                    <i class="bi bi-code-square me-2"></i>

                    Projects & Skills

                </h5>


                <div class="row g-3">


                    <!-- PROJECTS -->

                    <div class="col-12">

                        <label class="form-label">

                            Projects

                        </label>

                        <textarea
                            name="projects"
                            class="form-control"
                            rows="4"
                            placeholder="Describe your major projects..."
                        ></textarea>

                    </div>


                    <!-- SKILLS -->

                    <div class="col-12">

                        <label class="form-label">

                            Technical Skills

                        </label>

                        <textarea
                            name="skills"
                            class="form-control"
                            rows="3"
                            placeholder="Python, Flask, Machine Learning, SQL..."
                        ></textarea>

                    </div>


                    <!-- CAREER GOAL -->

                    <div class="col-12">

                        <label class="form-label">

                            Career Goal

                        </label>

                        <textarea
                            name="career_goal"
                            class="form-control"
                            rows="3"
                            placeholder="What kind of career are you looking for?"
                        ></textarea>

                    </div>

                </div>



                <!-- =================================================
                     START
                ================================================= -->

                <div class="text-center mt-5">

                    <button
                        type="submit"
                        class="btn btn-primary start-btn"
                    >

                        <i class="bi bi-play-circle me-2"></i>

                        Start AI Interview

                    </button>

                </div>


            </form>


        </div>

    </div>

</div>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
