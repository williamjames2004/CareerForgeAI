<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerForge AI - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#eef2ff,#ffffff,#f5f3ff);
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .login-card {
            border: 0;
            border-radius: 26px;
            box-shadow: 0 20px 60px rgba(0,0,0,.09);
        }

        .form-control {
            min-height: 52px;
            border-radius: 12px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 .2rem rgba(79,70,229,.12);
        }

        .btn-primary {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        .login-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
    </style>
</head>

<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none text-dark">
                <div class="d-flex justify-content-center align-items-center gap-2">
                    <div class="brand-icon">
                        <i class="bi bi-stars"></i>
                    </div>
                    <h4 class="fw-bold mb-0">CareerForge AI</h4>
                </div>
            </a>
        </div>

        <div class="card login-card p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="login-icon mx-auto mb-3">
                    <i class="bi bi-person-lock"></i>
                </div>

                <h2 class="fw-bold">
                    Welcome Back
                </h2>

                <p class="text-secondary mb-0">
                    Login to continue your placement preparation.
                </p>
            </div>

            <div id="message"></div>

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="togglePassword"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100 rounded-3"
                    id="loginBtn"
                >
                    <span id="loginText">
                        Login
                    </span>

                    <span
                        id="loginLoader"
                        class="spinner-border spinner-border-sm d-none"
                    ></span>
                </button>

            </form>

            <div class="text-center mt-4">
                <span class="text-secondary">
                    Don't have an account?
                </span>

                <a
                    href="register.html"
                    class="text-primary fw-semibold text-decoration-none"
                >
                    Create Account
                </a>
            </div>

        </div>

        <div class="text-center mt-4">
            <a
                href="index.html"
                class="text-secondary text-decoration-none small"
            >
                <i class="bi bi-arrow-left me-1"></i>
                Back to Home
            </a>
        </div>

    </div>

</div>


<script>
const API_BASE = "http://127.0.0.1:5000";

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const loginText = document.getElementById("loginText");
const loginLoader = document.getElementById("loginLoader");
const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");


if (localStorage.getItem("careerforge_token")) {
    window.location.href = "index.html";
}


function showMessage(text, type = "danger") {
    message.innerHTML = `
        <div class="alert alert-${type} rounded-3">
            ${text}
        </div>
    `;
}


togglePassword.addEventListener("click", function() {
    if (password.type === "password") {
        password.type = "text";
        this.innerHTML = '<i class="bi bi-eye-slash"></i>';
    } else {
        password.type = "password";
        this.innerHTML = '<i class="bi bi-eye"></i>';
    }
});


loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const passwordValue = password.value;

    loginBtn.disabled = true;
    loginText.classList.add("d-none");
    loginLoader.classList.remove("d-none");
    message.innerHTML = "";

    try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: passwordValue
            })
        });

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message || "Login failed.");
        }

        localStorage.setItem("careerforge_token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        showMessage("Login successful. Redirecting...", "success");

        setTimeout(function() {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get("redirect");

            window.location.href = redirect || "index.html";
        }, 700);

    } catch (error) {
        showMessage(error.message);
        loginBtn.disabled = false;
        loginText.classList.remove("d-none");
        loginLoader.classList.add("d-none");
    }
});
</script>

</body>
</html>
