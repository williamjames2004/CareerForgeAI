<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerForge AI - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#eef2ff,#ffffff,#f5f3ff);
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .register-card {
            border: 0;
            border-radius: 26px;
            box-shadow: 0 20px 60px rgba(0,0,0,.09);
        }

        .form-control {
            min-height: 50px;
            border-radius: 12px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 .2rem rgba(79,70,229,.12);
        }

        .btn-primary {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        .register-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
    </style>
</head>

<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6">

        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none text-dark">
                <div class="d-flex justify-content-center align-items-center gap-2">
                    <div class="brand-icon">
                        <i class="bi bi-stars"></i>
                    </div>
                    <h4 class="fw-bold mb-0">CareerForge AI</h4>
                </div>
            </a>
        </div>

        <div class="card register-card p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="register-icon mx-auto mb-3">
                    <i class="bi bi-person-plus"></i>
                </div>

                <h2 class="fw-bold">
                    Create Your Account
                </h2>

                <p class="text-secondary mb-0">
                    Start your AI-powered placement preparation.
                </p>
            </div>

            <div id="message"></div>

            <form id="registerForm">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="phoneno"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Country
                        </label>

                        <select
                            class="form-select form-control"
                            id="country"
                            required
                        >
                            <option value="">Select Country</option>
                            <option value="India">India</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="Australia">Australia</option>
                            <option value="Singapore">Singapore</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Minimum 6 characters"
                            minlength="6"
                            required
                        >
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >
                    </div>

                </div>

                <div class="form-check mt-4">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label class="form-check-label text-secondary" for="terms">
                        I agree to use CareerForge AI for placement preparation.
                    </label>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100 rounded-3 mt-4"
                    id="registerBtn"
                >
                    <span id="registerText">
                        Create Account
                    </span>

                    <span
                        id="registerLoader"
                        class="spinner-border spinner-border-sm d-none"
                    ></span>
                </button>

            </form>

            <div class="text-center mt-4">
                <span class="text-secondary">
                    Already have an account?
                </span>

                <a
                    href="login.html"
                    class="text-primary fw-semibold text-decoration-none"
                >
                    Login
                </a>
            </div>

        </div>

        <div class="text-center mt-4">
            <a
                href="index.html"
                class="text-secondary text-decoration-none small"
            >
                <i class="bi bi-arrow-left me-1"></i>
                Back to Home
            </a>
        </div>

    </div>

</div>


<script>
const API_BASE = "http://127.0.0.1:5000";

const registerForm = document.getElementById("registerForm");
const message = document.getElementById("message");
const registerBtn = document.getElementById("registerBtn");
const registerText = document.getElementById("registerText");
const registerLoader = document.getElementById("registerLoader");


if (localStorage.getItem("token")) {
    window.location.href = "index.html";
}


function showMessage(text, type = "danger") {
    message.innerHTML = `
        <div class="alert alert-${type} rounded-3">
            ${text}
        </div>
    `;
}


registerForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phoneno = document.getElementById("phoneno").value.trim();
    const email = document.getElementById("email").value.trim();
    const country = document.getElementById("country").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
    }

    if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
    }

    registerBtn.disabled = true;
    registerText.classList.add("d-none");
    registerLoader.classList.remove("d-none");
    message.innerHTML = "";

    try {
        const response = await fetch(`${API_BASE}/api/auth/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                phoneno: phoneno,
                country: country,
                password: password
            })
        });

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message || "Registration failed.");
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        showMessage(
            "Account created successfully. Redirecting...",
            "success"
        );

        setTimeout(function() {
            window.location.href = "index.html";
        }, 800);

    } catch (error) {
        showMessage(error.message);

        registerBtn.disabled = false;
        registerText.classList.remove("d-none");
        registerLoader.classList.add("d-none");
    }
});
</script>

</body>
</html>
